name: StoreKit Subscription Product Check

on:
  workflow_dispatch:

jobs:
  check-products:
    name: Verify App Store subscription product IDs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_BUNDLE_ID: com.eksperiq.app
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify subscription product IDs
        run: npm run storekit:products-check
