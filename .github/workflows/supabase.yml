name: Supabase Production Migration

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply migrations to the production Supabase database"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  migrate:
    name: Validate and optionally apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Supabase app env
        run: npm run supabase:env-check -- --required

      - name: Install Supabase CLI
        run: npm install -g supabase@2.113.0

      - name: Show Supabase CLI version
        run: supabase --version

      - name: List remote migration status
        run: supabase migration list --db-url "${SUPABASE_DATABASE_URL}"

      - name: Dry-run production migration
        if: inputs.apply_migrations != 'true'
        run: supabase db push --db-url "${SUPABASE_DATABASE_URL}" --dry-run

      - name: Apply production migration
        if: inputs.apply_migrations == 'true'
        run: supabase db push --db-url "${SUPABASE_DATABASE_URL}" --yes
