name: iOS Archive and TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the exported IPA to TestFlight"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      xcode_path:
        description: "Optional DEVELOPER_DIR, for example /Applications/Xcode_26.app/Contents/Developer"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  archive:
    name: Build signed iOS archive
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.eksperiq.app
      SCHEME: App
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      NEXT_PUBLIC_STOREKIT_PURCHASES_ENABLED: ${{ secrets.NEXT_PUBLIC_STOREKIT_PURCHASES_ENABLED }}
      STOREKIT_APP_STORE_PRODUCTS_VERIFIED: ${{ secrets.STOREKIT_APP_STORE_PRODUCTS_VERIFIED }}
      STOREKIT_SANDBOX_PURCHASE_VERIFIED: ${{ secrets.STOREKIT_SANDBOX_PURCHASE_VERIFIED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.xcode_path }}" ]; then
            sudo xcode-select -s "${{ inputs.xcode_path }}"
          elif [ -d "/Applications/Xcode_26.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.app/Contents/Developer"
          fi

          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            26*|27*|28*|29*) ;;
            *)
              echo "::error::App Store uploads require the iOS 26 SDK or later. Select an Xcode 26+ toolchain."
              exit 1
              ;;
          esac

      - name: Detect package manager
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "PM_INSTALL=npm ci" >> "${GITHUB_ENV}"
            echo "PM_RUN=npm run" >> "${GITHUB_ENV}"
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            echo "PM_INSTALL=pnpm install --frozen-lockfile" >> "${GITHUB_ENV}"
            echo "PM_RUN=pnpm run" >> "${GITHUB_ENV}"
          elif [ -f yarn.lock ]; then
            corepack enable
            echo "PM_INSTALL=yarn install --immutable" >> "${GITHUB_ENV}"
            echo "PM_RUN=yarn" >> "${GITHUB_ENV}"
          else
            echo "::error::No supported lock file found."
            exit 1
          fi

      - name: Install locked dependencies
        run: $PM_INSTALL

      - name: Typecheck
        run: $PM_RUN typecheck

      - name: Lint
        run: $PM_RUN lint

      - name: Test
        run: $PM_RUN test

      - name: StoreKit release gate
        run: $PM_RUN storekit:gate-check

      - name: Build web app
        run: $PM_RUN build

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme "${SCHEME}"

      - name: Validate signing secrets
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install signing assets
        id: signing
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          KEYCHAIN_PATH="${RUNNER_TEMP}/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf "%s" "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
          printf "%s" "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${PROFILE_PLIST}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "${PROFILE_PLIST}")"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "keychain_path=${KEYCHAIN_PATH}" >> "${GITHUB_OUTPUT}"
          echo "profile_name=${PROFILE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/EksperIQ.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            2>&1 | tee xcodebuild-archive.log

      - name: Create export options
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/EksperIQ.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee xcodebuild-export.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: eksperiq-ios-ipa
          path: build/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/private_keys"
          API_KEY_PATH="${HOME}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf "%s" "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" | base64 --decode > "${API_KEY_PATH}"
          chmod 600 "${API_KEY_PATH}"
          IPA_PATH="$(find build/export -name '*.ipa' -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "::error::No IPA was exported."
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Upload Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-archive.log
            xcodebuild-export.log
            ExportOptions.plist
          retention-days: 14

      - name: Clean signing assets
        if: always()
        run: |
          set +e
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}"
          rm -rf "${HOME}/private_keys"
          rm -f "${RUNNER_TEMP}/distribution.p12" "${RUNNER_TEMP}/profile.mobileprovision" "${RUNNER_TEMP}/profile.plist"
