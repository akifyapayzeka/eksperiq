name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Coverage
        run: npm run coverage

      - name: Build (static export)
        run: npm run build

      - name: Install Playwright browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: E2E — Chromium
        run: npx playwright test --project=chromium --project=mobile

      - name: E2E — WebKit
        run: npx playwright test --project=webkit --project=mobile-safari

      - name: Security — sensitive data / leaked secrets scan
        run: npm run privacy:check

      - name: Privacy — no over-claiming user-facing language
        run: npm run claims:check

      - name: App Store metadata check
        run: npm run appstore:metadata-check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
