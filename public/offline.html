<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1a2f" />
    <title>EksperIQ çevrimdışı</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Arial,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8fafc;
        color: #102033;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
      }

      main {
        max-width: 560px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 16px 0 0;
        color: #475569;
        font-size: 1rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        margin-top: 24px;
        border-radius: 8px;
        background: #0f766e;
        color: #ffffff;
        padding: 0 18px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı yok</h1>
      <p>
        EksperIQ karar desteği için sayfaların yüklenmesi gerekir. İnternet bağlantınızı kontrol edip tekrar deneyin.
        Girilen bilgiler sunucuya kaydedilmez.
      </p>
      <a href="/">Ana sayfaya dön</a>
    </main>
  </body>
</html>
